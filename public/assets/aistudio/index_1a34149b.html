un trabajo, mudarte o hacer un gasto grande: orar, pedir consejo y revisar tus motivos.", "Cuando tengas dudas, hacer lo que está en tus manos y entregar el resultado a Dios.", "Reconocer a Dios también en decisiones pequeñas, como el trato que darás hoy a alguien."], "q": ["¿Qué significa que sea con «todo» el corazón? ¿Dónde sueles confiar a medias?", "¿Qué diferencia hay entre pensar bien y apoyarse en el propio entendimiento?", "¿En qué decisión te estás apoyando solo en lo que entiendes?", "¿Cómo se ve en la práctica reconocer a Dios en tus caminos?", "¿Qué promete Dios aquí y qué te toca hacer a ti?"]}, "Filipenses 4:6-7": {"c": "Carta de Pablo a la iglesia de Filipos, escrita estando él preso (Fil. 1:7, 13); aquí cierra con exhortaciones prácticas.", "o": ["Un mandato: no estar afanosos por nada.", "La respuesta propuesta es la oración y la súplica, con acción de gracias, presentando las peticiones a Dios.", "Una promesa: la paz de Dios, que supera todo entendimiento, guardará los corazones y los pensamientos.", "Esa paz se sitúa «en Cristo Jesús» (v. 7)."], "i": "La ansiedad se enfrenta llevando cada preocupación a Dios con gratitud. La paz es lo que Dios da como resultado; no es algo que la persona fabrique por sí misma.", "a": ["Cuando te preocupes por dinero, salud o un familiar: escribir la petición, orarla y añadir tres cosas por las que das gracias.", "En una noche con la mente llena de pendientes: anotarlos y entregarlos en oración antes de dormir.", "Antes de una conversación difícil: orar por la situación y por la otra persona."], "q": ["¿Qué diferencia hay entre presentar peticiones a Dios y afanarse?", "¿Por qué crees que Pablo incluye la acción de gracias?", "¿Qué significa que la paz «guarde» el corazón y la mente?", "¿Qué preocupación vas a poner en palabras ante Dios hoy?", "¿Qué puedes agradecer en medio de lo que te inquieta?"]}, "Josué 1:9": {"c": "Dios comisiona a Josué para guiar a Israel hacia la tierra prometida tras la muerte de Moisés (Jos. 1:1-2).", "o": ["Dios habla a Josué después de la muerte de Moisés.", "El mandato de ser fuerte y valiente se repite (vv. 6, 7 y 9).", "Una prohibición: no temer ni desmayar.", "La razón que se da: el Señor su Dios está con él dondequiera que vaya."], "i": "La valentía que Dios pide se apoya en su presencia, no en la fuerza de la persona. El versículo 8 une esa valentía con meditar la ley y obedecerla.", "a": ["Ante una conversación que temes (corregir a alguien, pedir perdón): dar el primer paso recordando que no estás solo.", "Ante un cambio grande (mudanza, nuevo trabajo): decidir qué paso concreto darás hoy.", "Hacer lo correcto aunque cueste, en el trabajo o en la familia."], "q": ["¿Por qué crees que Dios repite «sé fuerte y valiente»?", "¿Qué razón da Dios para no temer?", "¿Qué relación ves entre la valentía de este versículo y el versículo 8?", "¿Qué situación te pide valentía hoy?", "¿Qué cambia en esa situación al recordar que Dios te acompaña?"]}, "Isaías 41:10": {"c": "Mensaje de aliento de Dios a Israel dentro de la sección de Isaías 40–48 (aquí, 41:8-14).", "o": ["Dios habla en primera persona: «yo estoy contigo», «yo soy tu Dios».", "Dos órdenes: no temas y no desmayes.", "Tres acciones de Dios: fortalecer, ayudar y sustentar.", "Se dirige a Israel, llamado «siervo» suyo (41:8)."], "i": "El consuelo se apoya en quién es Dios y en lo que él hace por su pueblo, no en la ausencia de dificultades.", "a": ["Ante una mala noticia: pedir fuerza para el día de hoy sin cargar solo con el mañana.", "En una crisis familiar o de salud: pedir ayuda concreta a personas de confianza, sin avergonzarte.", "Cuando el miedo te paralice: elegir un paso pequeño y darlo."], "q": ["¿Qué razones da Dios para que no temas?", "¿Qué diferencia hay entre fortalecer, ayudar y sustentar?", "¿A quién se dirigía originalmente esta palabra y en qué situación estaba?", "¿Qué temor concreto estás cargando hoy?", "¿Qué harías distinto si confiaras en esta promesa?"]}, "Mateo 6:33": {"c": "Parte del Sermón del Monte, en la enseñanza de Jesús sobre la ansiedad y las prioridades (Mt. 6:25-34).", "o": ["Jesús enseña en el Sermón del Monte (Mt. 5–7), dirigido a sus discípulos con la multitud presente.", "Viene después de repetir «no os afanéis» por comida, ropa y mañana (6:25-32).", "Un mandato: buscar primero el reino de Dios y su justicia.", "Una promesa: «todas estas cosas» (lo necesario) serán añadidas."], "i": "Jesús ordena las prioridades: primero el reino y la justicia de Dios. Las necesidades básicas no se descuidan, pero dejan de dominar la vida.", "a": ["Al planear la semana, apartar primero el tiempo para orar y servir, y luego llenar el resto.", "Al hacer un presupuesto: separar primero lo que das y lo que ahorras, y después los gastos.", "Si el trabajo te absorbe: poner un límite de horario para estar con tu familia y tu comunidad."], "q": ["¿Qué estaba preocupando a quienes escuchaban a Jesús en este pasaje?", "¿Qué significa buscar «primero» el reino de Dios?", "¿Qué ocupa hoy el primer lugar en tu agenda?", "¿Qué prometió Jesús y qué no prometió?", "¿Qué cambiarías esta semana para poner primero lo que él menciona?"]}, "Salmo 46:1": {"c": "Salmo atribuido en su encabezado a los hijos de Coré; expresa confianza en Dios ante la agitación.", "o": ["Declara que Dios es refugio y fortaleza.", "Añade que es una ayuda muy pronta, es decir, disponible, en las tribulaciones.", "Los versículos 2-3 describen sacudidas de la tierra, montes y aguas, y dicen que no se temerá.", "Un estribillo se repite en los versículos 7 y 11: «el Señor de los ejércitos está con nosotros»."], "i": "La confianza en Dios no depende de que el entorno sea estable: en medio de la agitación, Dios es el lugar seguro.", "a": ["En una crisis de salud o de trabajo: acudir a Dios en oración y también a personas que pueden ayudar.", "Cuando las noticias te angustien: reducir el consumo y leer el salmo completo.", "Acompañar a alguien que sufre con una acción concreta: una visita, una llamada o una comida."], "q": ["¿Qué imágenes de seguridad usa el salmo?", "¿Qué situaciones de agitación describe y qué dice que no hará el salmista?", "¿Qué significa que la ayuda sea «muy pronta»?", "¿Dónde buscas refugio primero cuando hay problemas?", "¿Qué te dice el estribillo de los versículos 7 y 11?"]}, "Colosenses 3:23": {"c": "Carta de Pablo a los colosenses. Está dentro de instrucciones para la vida cotidiana (Col. 3:18–4:1); el v. 22 se dirige a esclavos.", "o": ["Pablo escribe a la iglesia de Colosas.", "El versículo está en instrucciones para la vida diaria (3:18–4:1); el v. 22 se dirige a esclavos y el v. 23 amplía a «todo lo que hagáis».", "Un mandato: hacerlo de corazón.", "La razón: como para el Señor y no para las personas; el v. 24 menciona la recompensa que viene del Señor."], "i": "El valor del trabajo se mide ante el Señor, no solo ante las personas. Hacerlo con integridad y entrega es una forma de servirle.", "a": ["En el trabajo o el estudio: hacer bien una tarea poco visible.", "En casa: realizar las tareas domésticas con buena actitud y sin quejarte.", "En el servicio de la iglesia: cumplir lo que prometiste aunque nadie lo reconozca."], "q": ["¿A quién se dirigía originalmente el pasaje y en qué situación vivían?", "¿Qué cambia si piensas «para el Señor» y no «para la gente»?", "¿Qué significa hacerlo «de corazón»?", "¿Qué tarea has estado haciendo sin ganas?", "¿Cómo podrías servir a Dios en tu trabajo esta semana?"]}, "Santiago 1:5": {"c": "Carta de Santiago; en este pasaje habla de las pruebas y de pedir sabiduría (Stg. 1:2-8).", "o": ["Es una condición: «si alguno tiene falta de sabiduría».", "El mandato es pedirla a Dios.", "Dios da a todos abundantemente y sin reproche.", "La promesa es «le será dada»; los versículos 6-8 piden pedir con fe, sin dudar."], "i": "Dios es generoso para dar sabiduría a quien se la pide, y no reprocha la falta. Pedirla es parte de la respuesta a las pruebas, junto con la perseverancia (1:2-4).", "a": ["Ante una decisión importante (cambiar de trabajo, un conflicto familiar): pedir sabiduría en oración antes de actuar.", "Si fallaste en algo: pedir sabiduría para no repetirlo, sin cargarte de culpa.", "Buscar el consejo de personas maduras mientras oras."], "q": ["¿Qué condición pone el versículo y a quién va dirigido?", "¿Qué significa que Dios da «sin reproche»?", "¿Cómo se relacionan las pruebas (vv. 2-4) con pedir sabiduría?", "¿Qué decisión necesita sabiduría hoy y cuándo se la pedirás a Dios?", "¿Qué te frena a pedirla: la duda, la vergüenza o la prisa?"]}, "Mateo 11:28": {"c": "Invitación de Jesús al final del capítulo 11 (Mt. 11:25-30), tras su alabanza al Padre.", "o": ["Jesús invita: «venid a mí».", "Se dirige a los fatigados y cargados.", "Promete: «yo os haré descansar».", "El versículo 29 explica cómo: tomar su yugo y aprender de él, que es manso y humilde de corazón."], "i": "El descanso se ofrece en una relación con Jesús, no como una técnica: él invita, da descanso y enseña con mansedumbre.", "a": ["Cuando estés agotado: apartar un rato a solas para orar y descansar sin culpa.", "Si cargas con cosas que no te tocan: pedir ayuda o delegar.", "Fijar un tiempo de descanso regular cada semana."], "q": ["¿A quiénes invita Jesús en este versículo?", "¿Qué diferencia hay entre descansar y simplemente parar?", "¿Qué quiere decir «tomar su yugo» según el versículo 29?", "¿Qué carga llevas hoy que no te corresponde llevar solo?", "¿Qué paso concreto darías para responder a esta invitación?"]}, "1 Tesalonicenses 5:16-18": {"c": "Parte de las exhortaciones finales de la primera carta de Pablo a los tesalonicenses (1 Ts. 5:12-22).", "o": ["Pablo escribe a la iglesia de Tesalónica; forma parte de exhortaciones breves (5:12-22).", "Tres mandatos: estar siempre gozosos, orar sin cesar y dar gracias en todo.", "«Siempre», «sin cesar» y «en todo» expresan continuidad.", "El versículo 18 añade que esta es la voluntad de Dios para ellos en Cristo Jesús."], "i": "El gozo, la oración y la gratitud son una manera de vivir con Dios de forma continua. La gratitud es «en» toda circunstancia, no «por» todo lo que ocurre.", "a": ["Elegir tres momentos del día para orar brevemente: al despertar, al mediodía y al dormir.", "Escribir cada noche una cosa buena del día.", "Dar las gracias a una persona que te ayudó esta semana."], "q": ["¿Qué tres mandatos aparecen y qué palabras acompañan a cada uno?", "¿Qué diferencia hay entre dar gracias «en todo» y «por todo»?", "¿Qué significa orar «sin cesar» en la vida real?", "¿Qué te dificulta estar agradecido esta semana?", "¿Con quién podrías compartir algo por lo que estás agradecido?"]}, "Gálatas 6:9": {"c": "Parte de las exhortaciones finales de la carta de Pablo a los gálatas, sobre ayudarse unos a otros (Gá. 6:1-10).", "o": ["Pablo escribe a las iglesias de Galacia; el pasaje trata de ayudarse unos a otros (6:1-10).", "El mandato es no cansarse de hacer el bien.", "La promesa depende de una condición: a su tiempo se cosechará si no se desmaya.", "Usa la imagen de sembrar y cosechar (vv. 7-8)."], "i": "Hacer el bien requiere constancia. El fruto llega «a su tiempo», no de inmediato, y la perseverancia es la condición.", "a": ["Seguir llamando o visitando a alguien que sufre, aunque no veas cambios rápidos.", "Mantener un servicio regular, como ayudar en tu comunidad cada semana.", "Corregir con paciencia en casa en vez de rendirte."], "q": ["¿Qué imagen usa Pablo y qué dice sobre el tiempo?", "¿Qué condición pone el versículo para cosechar?", "¿Qué bien has dejado de hacer por cansancio?", "¿Qué te ayudaría a perseverar, sobre todo en lo que no da resultados rápidos?", "¿A quién podrías ayudar esta semana y cómo?"]}, "Salmo 23:1": {"c": "Salmo que su encabezado atribuye a David y que usa la imagen del pastor.", "o": ["El encabezado lo atribuye a David.", "Usa una imagen en primera persona: «el Señor es mi pastor».", "Consecuencia: «nada me faltará».", "El salmo desarrolla la imagen: pastos, aguas de reposo, sendas, el valle de sombra de muerte, la mesa y la casa del Señor."], "i": "Dios cuida como un pastor: guía, provee y acompaña. La confianza se apoya en quién es el pastor, no en la ausencia de dificultades, porque el propio salmo menciona el valle de sombra de muerte.", "a": ["Cuando sientas carencia: enumerar lo que sí tienes, agradecerlo y pedir lo que necesitas.", "Al decidir: buscar la guía de Dios en su Palabra y en consejeros de confianza.", "En momentos de miedo: leer el salmo completo."], "q": ["¿Qué hace un pastor por sus ovejas y cómo aparece en el salmo?", "¿Qué significa «nada me faltará» a la luz del resto del salmo?", "¿Qué lugares y momentos menciona el salmo, desde los pastos hasta el valle oscuro?", "¿Dónde sientes hoy falta o necesidad?", "¿Quién ha sido un «pastor» para ti y cómo podrías serlo para otro?"]}, "Romanos 12:2": {"c": "Inicio de la sección práctica de la carta de Pablo a los romanos (Ro. 12:1), tras los capítulos 1–11.", "o": ["Pablo escribe a los creyentes en Roma; el versículo 1 empieza con «por las misericordias de Dios».", "Dos mandatos: no conformarse a este siglo y ser transformados mediante la renovación del entendimiento.", "«Transformaos» está en voz pasiva: se trata de ser transformado.", "El propósito: comprobar cuál es la voluntad de Dios, buena, agradable y perfecta."], "i": "El cambio de vida empieza en la mente: dejarse transformar por Dios, y no moldear por la cultura del entorno, permite discernir su voluntad.", "a": ["Revisar qué contenido consumes (redes, series, noticias) y qué efecto tiene en tus pensamientos y decisiones.", "Reemplazar un pensamiento repetido, como «no sirvo para nada», por lo que dice la Biblia sobre ti.", "Dedicar tiempo diario a la Biblia para ir renovando tus criterios."], "q": ["¿Qué significa «este siglo» y cómo se refleja en tu entorno?", "¿Qué diferencia hay entre conformarse y ser transformado?", "¿Qué pensamiento o criterio tuyo necesita renovarse?", "¿Qué relación ves entre este versículo y el versículo 1?", "¿Qué hábito te ayudaría a renovar tu mente de forma constante?"]}, "Lamentaciones 3:22-23": {"c": "Está en un libro de lamento por la destrucción de Jerusalén; el capítulo 3 expresa esperanza en medio del dolor. El libro no nombra a su autor.", "o": ["Está en un libro de lamento por la destrucción de Jerusalén.", "El capítulo 3 expresa primero dolor (vv. 1-20) y luego esperanza (vv. 21-24).", "Dice que las misericordias del Señor no se acaban y que sus compasiones no se agotan.", "Son nuevas cada mañana, y el versículo 23 termina con «grande es tu fidelidad»."], "i": "La esperanza no ignora el dolor: nace de recordar el carácter fiel de Dios, que se renueva cada día.", "a": ["Al empezar el día, nombrar una muestra de la fidelidad de Dios en la última semana.", "Si atraviesas una pérdida: permitirte lamentar y a la vez recordar lo que Dios sigue haciendo.", "Llevar un registro de respuestas y provisiones para releer en los días difíciles."], "q": ["¿Qué contraste hay entre los versículos 1-20 y los versículos 21-24?", "¿Qué significa que las misericordias sean «nuevas cada mañana»?", "¿Qué hizo el autor para pasar del dolor a la esperanza (v. 21)?", "¿Qué muestra de la fidelidad de Dios puedes recordar hoy?", "¿A quién podrías animar compartiéndole este versículo?"]}};

{X.i?`<p><b>2. Interpretación:</b> ${esc(X.i)}</p>`:""}${X.a?`<p><b>3. Aplicación</b></p><ul style="padding-left:18px;line-height:1.6;margin-top:0">${X.a.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}<p class="sub">Puntos redactados a partir del texto y de su contexto; contrástalos con tu Biblia.</p><label class="sub">Escribe el texto en tu versión de la Biblia (opcional)<textarea oninput="vsv(this.dataset.r,this.value)" data-r="${esc(ref)}" placeholder="Pega aquí el versículo tal como aparece en tu Biblia">${esc(mine)}</textarea></label></div>`:"")+`<button class="lk" data-a="open" data-s="dform" data-p="reflexion|${esc(ref)}">Reflexionar sobre este pasaje →</button></div></div>`};
